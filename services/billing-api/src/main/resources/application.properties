spring.application.name=billing-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/billing}
spring.datasource.username=${DB_USERNAME:billing}
spring.datasource.password=${DB_PASSWORD:billing}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
billing.events.topic-arn=${EVENTS_TOPIC_ARN:}
billing.outbox.poll-interval=${OUTBOX_POLL_INTERVAL:PT5S}
billing.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
billing.invoicing.queue-url=${INVOICING_QUEUE_URL:}
billing.invoicing.poll-wait-seconds=${INVOICING_POLL_WAIT_SECONDS:20}
billing.aws.endpoint-override=${AWS_ENDPOINT_OVERRIDE:}
